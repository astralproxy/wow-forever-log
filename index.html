<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  
  <div class="header-container">
    <img src="logo.png" alt="Logo" class="header-logo">
    <h1>Forever Log</h1>
    <!--<span class="header-note">✅ items to mark them as explored.</span>-->
  </div>
  
  <div class="wiki-layout">      
    <!-- LEFT SIDEBAR MENU -->
    <aside class="wiki-sidebar">
      <div class="sidebar-title">Navigation</div>
      <ul class="sidebar-menu">
        <li><a href="#" class="sidebar-link active" onclick="filterByCategory('ALL', this)">ALL</a></li>
        <li><a href="#" class="sidebar-link" onclick="filterByCategory('Dungeons', this)">Dungeons</a></li>
        <li><a href="#" class="sidebar-link" onclick="filterByCategory('Raids', this)">Raids</a></li>
        <li><a href="#" class="sidebar-link" onclick="filterByCategory('Zones', this)">Zones</a></li>
        <li><a href="#" class="sidebar-link" onclick="filterByCategory('Camping', this)">Camping</a></li>
        <li><a href="#" class="sidebar-link" onclick="filterByCategory('Legacy', this)">Legacy</a></li>
      </ul>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="wiki-content">

      <!-- FILTERS at top of page -->
      <div class="filter-bar">
        <div class="filter-group" id="contentFilters">
          <label for="toggleProgress">
            <input type="checkbox" id="toggleProgress" checked onchange="toggleProgressColumn()"> Show Progress
          </label>
          <label for="filterLevel">| Level:</label>
          <select id="filterLevel" onchange="applyFilters()">
            <option value="ALL">All Levels</option>
            <option value="1-10">1-10</option>
            <option value="11-20">11-20</option>
            <option value="21-30">21-30</option>
            <option value="31-40">31-40</option>
            <option value="41-50">41-50</option>
            <option value="51-60">51-60</option>
            <option value="60">60 Only</option>
          </select>
  
          <!--<label for="filterType">Type:</label>
          <select id="filterType" onchange="applyFilters()">
            <option value="ALL">All Types</option>
          </select>-->
        </div>

        <div class="filter-group" id="legacyFilters" style="display: none;">
          <label for="filterLegacyType">Type:</label>
          <select id="filterLegacyType" onchange="applyFilters()">
            <option value="ALL">All Types</option>
            <option value="class">Class</option>
            <option value="profession">Profession</option>
            <option value="adventure">Adventure</option>
            <option value="pvp">PvP</option>
          </select>
        </div>

        <div class="filter-group" id="campingFilters" style="display: none;">
          <label for="filterCampingType">Type:</label>
          <select id="filterCampingType" onchange="applyFilters()">
            <option value="ALL">All Types</option>
          </select>
        </div>

        <div class="filter-group filter-search">
          <label for="filterSearch">Search:</label>
          <input type="text" id="filterSearch" placeholder="Search..." oninput="applyFilters()">
        </div>
      </div>

    <!-- WRAPPER FOR TABLE + SIDE PANEL -->
    <div class="content-body">
      <div class="table-container">
        <table id="checklistTable">
          <thead>
            <tr>
              <th class="col-cb no-sort"></th>
              <th class="col-level" onclick="sortTable(1)">Level</th>
              <th class="col-zone" onclick="sortTable(2)">Zone/Location</th>
              <th class="col-progress">Progress</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="4" class="status-msg">Loading Data...</td>
            </tr>
          </tbody>
        </table>
        <table id="legacyTable" hidden>
          <tbody>
            <tr>
              <td class="status-msg">Loading Legacy achievements...</td>
            </tr>
          </tbody>
        </table>
        <table id="campingTable" hidden>
          <thead>
            <tr>
              <th class="col-cb no-sort"></th>
              <th onclick="sortCampingTable(0)" aria-sort="none">Skill</th>
              <th onclick="sortCampingTable(1)" aria-sort="none">Type</th>
              <th onclick="sortCampingTable(2)" aria-sort="none">Item</th>
            </tr>
          </thead>
          <tbody id="campingTableBody">
            <tr>
              <td colspan="4" class="status-msg">Loading Camping data...</td>
            </tr>
          </tbody>
        </table>
      </div>

    <!-- Side Details Panel -->
    <aside id="detailsPanel" class="details-panel">
      <div class="panel-placeholder">Click a list item to view details.</div>
    </aside>
  </div>
</main>

<script>
  const LOADING_MESSAGES = [
    "Polishing corrupted Ashbringers",
    "Reading Barrens chat logs",
    "Teaching Murlocs proper syntax",
    "Inoculating battle pets",
    "Re-anchoring Dalaran",
    "Calculating Hogger's aggro radius",
    "Calibrating Gnomish algorithms",
    "Feeding stray Mana Wyrms",
    "Running back to corpse",
    "Polishing Onyxia's head",
    "Sorting soul shards by color",
    "Tuning the Deeprun Tram engines",
    "Herding Westfall chickens",
    "Assembling additional peons",
    "Sweeping the steps of Icecrown Citadel"
  ];
  
  const SPREADSHEET_ID = "1PWAetMYOglFXz7ISOKisYgRGpZ4Pnfa1D4WL1Hv7D94";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;
  const API_URL = "https://script.google.com/macros/s/AKfycbzlfcXQC8kkSWoIeDBj2IWslxsfrOTEHL00Sx2pu6795eOk05aI0NUd1pjZVfvWZjG8/exec"; // for notes, etc
  
  // Add URL for the detailed tabs/sheets using its gviz CSV endpoint or gid parameter
  const DUNGEON_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Dungeons`;
  const RAID_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Raids`;
  const ZONE_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Zones`;
  const LEGACY_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Legacy`;
  const CAMPING_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Camping`;

  let dungeonMap = new Map(); // Store dungeon lookup data keyed by name
  let raidMap = new Map(); // Store raid lookup data keyed by name
  let zoneMap = new Map(); // Store zone lookup data keyed by name
  let legacyColumns = [];
  let legacyRows = [];
  let campingRows = [];
  let campingSortColumn = -1;
  let campingSortAsc = true;
  const wowheadItemUrlCache = new Map();

  let rawTableData = [];
  let filteredData = [];
  let mainDataAvailable = true;
  let currentSortColumn = -1;
  let currentSortAsc = true;
  let currentCategory = "ALL";

  async function loadCampingData() {
    try {
      const response = await fetch(CAMPING_CSV_URL);
      if (!response.ok) throw new Error("Failed to fetch Camping data");

      const parsedRows = parseCSV(await response.text());
      campingRows = parsedRows.slice(1)
        .filter(row => row.slice(0, 6).some(value => (value || "").trim() !== ""))
        .map((row, index) => ({
          skill: row[0] || "",
          type: row[1] || "",
          item: row[2] || "",
          description: row[3] || "",
          tier: row[4] || "",
          reagents: row[5] || "",
          id: encodeURIComponent(`${row[0] || ""}|${row[1] || ""}|${row[2] || ""}|${index}`)
        }));

      populateCampingTypeFilterOptions();
      if (currentCategory.toLowerCase() === "camping") renderCampingTable();
    } catch (error) {
      console.error(error);
      campingRows = [];
      if (currentCategory.toLowerCase() === "camping") renderCampingTable();
    }
  }

  function getWowheadItemUrl(itemName) {
    const cacheKey = itemName.trim().toLowerCase();
    if (!wowheadItemUrlCache.has(cacheKey)) {
      const lookupUrl = `https://www.wowhead.com/item=${encodeURIComponent(itemName)}?xml`;
      wowheadItemUrlCache.set(cacheKey, fetch(lookupUrl)
        .then(response => {
          if (!response.ok) throw new Error("Failed to fetch Wowhead item data");
          return response.text();
        })
        .then(xmlText => {
          const item = new DOMParser().parseFromString(xmlText, "application/xml").querySelector("item");
          const itemId = item?.getAttribute("id");
          const canonicalUrl = item?.querySelector("link")?.textContent.trim();
          if (!/^\d+$/.test(itemId || "") || !canonicalUrl) return null;

          const url = new URL(canonicalUrl);
          return url.origin === "https://www.wowhead.com" && url.pathname.startsWith(`/item=${itemId}/`)
            ? url.href
            : null;
        })
        .catch(error => {
          console.warn(`Could not resolve Wowhead item: ${itemName}`, error);
          return null;
        }));
    }
    return wowheadItemUrlCache.get(cacheKey);
  }

  async function loadSheetData() {
    loadCampingData();
    const randomMsg = LOADING_MESSAGES[Math.floor(Math.random() * LOADING_MESSAGES.length)];
    const tbody = document.getElementById("tableBody");
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="status-msg">${escapeHtml(randomMsg)}...</td>
        </tr>`;
    }
    
    try {
      // 1. Fetch main data, Dungeon, Raid, and Zone CSV tabs concurrently
      const [mainRes, dungeonRes, raidRes, zoneRes, legacyRes] = await Promise.all([
        fetch(API_URL),
        fetch(DUNGEON_CSV_URL),
        fetch(RAID_CSV_URL),
        fetch(ZONE_CSV_URL),
        fetch(LEGACY_CSV_URL).catch(() => null)
      ]);
  
      mainDataAvailable = mainRes.ok;
      const data = mainRes.ok ? await mainRes.json() : [];
  
      // Parse Dungeon CSV tab
      if (dungeonRes.ok) {
        const csvText = await dungeonRes.text();
        const parsedRows = parseCSV(csvText);
        parsedRows.slice(1).forEach(row => {
          if (row.length > 1) {
            const name = row[1].trim().toLowerCase();
            dungeonMap.set(name, {
              level: row[0] || "",
              name: row[1] || "",
              location: row[2] || "",
              quests: row[3] || "",
              bosses: row[4] || "",
              image: row[6] ? row[6].trim() : ""
            });
          }
        });
      }

      // Parse Raid CSV tab
      if (raidRes.ok) {
        const csvText = await raidRes.text();
        const parsedRows = parseCSV(csvText);
        parsedRows.slice(1).forEach(row => {
          if (row.length > 1) {
            const name = row[1].trim().toLowerCase();
            raidMap.set(name, {
              level: row[0] || "",
              name: row[1] || "",
              location: row[2] || "",
              quests: row[3] || "",
              bosses: row[4] || "",
              image: row[6] ? row[6].trim() : ""
            });
          }
        });
      }

      // Parse Zone CSV tab
      if (zoneRes.ok) {
        const csvText = await zoneRes.text();
        const parsedRows = parseCSV(csvText);
        parsedRows.slice(1).forEach(row => {
          if (row.length > 1) {
            const name = row[1].trim().toLowerCase();
            zoneMap.set(name, {
              level: row[0] || "",
              name: row[1] || "",
              location: row[2] || "",
              quests: row[3] || "",
              bosses: row[4] || "",
              image: row[6] ? row[6].trim() : ""
            });
          }
        });
      }

      if (legacyRes?.ok) {
        const parsedRows = parseCSV(await legacyRes.text());
        legacyColumns = (parsedRows[0] || [])
          .map((name, index) => ({ name, index }))
          .filter(column => column.name.trim() !== "");
        legacyRows = parsedRows.slice(1)
          .filter(row => legacyColumns.some(column => (row[column.index] || "").trim() !== ""))
          .map(row => ({
            values: legacyColumns.map(column => row[column.index] || ""),
            id: encodeURIComponent(legacyColumns.map(column => row[column.index] || "").join("|").toLowerCase())
          }));
      }

      rawTableData = data.map(item => ({
        id: (item.zone || "").toLowerCase().replace(/[^a-z0-9]/g, "-"),
        level: item.level || "",
        zone: item.zone || "",
        type: item.type || item.activity || "",
        cellNotes: item.cellNotes || { level: "", zone: "", type: "" }
      })).filter(item => item.zone.trim() !== "");

      populateTypeFilterOptions();
  
      currentSortColumn = 1;
      currentSortAsc = true;
      const requestedCategory = new URLSearchParams(window.location.search).get("nav");
      const categories = ["ALL", "Dungeons", "Raids", "Zones", "Camping", "Legacy"];
      currentCategory = categories.find(category => category.toLowerCase() === requestedCategory?.toLowerCase()) || "ALL";
      const activeLink = [...document.querySelectorAll(".sidebar-link")].find(link => {
        const label = currentCategory === "ALL" ? "all content" : currentCategory.toLowerCase();
        return link.textContent.trim().toLowerCase() === label;
      });
      filterByCategory(currentCategory, activeLink);
    } catch (err) {
      console.error(err);
      document.getElementById("tableBody").innerHTML = `
        <tr>
          <td colspan="4" class="status-msg" style="color: #ff6b6b;">
            Error loading data...
          </td>
        </tr>`;
    }
  }

  function parseCSV(text) {
    const lines = [];
    let row = [];
    let inQuotes = false;
    let currentCell = '';

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (inQuotes && nextChar === '"') {
          currentCell += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        row.push(currentCell.trim());
        currentCell = '';
      } else if ((char === '\r' || char === '\n') && !inQuotes) {
        if (char === '\r' && nextChar === '\n') i++;
        row.push(currentCell.trim());
        if (row.some(cell => cell !== '')) lines.push(row);
        row = [];
        currentCell = '';
      } else {
        currentCell += char;
      }
    }
    if (currentCell || row.length > 0) {
      row.push(currentCell.trim());
      if (row.some(cell => cell !== '')) lines.push(row);
    }
    return lines;
  }

  function populateTypeFilterOptions() {
    const typeSelect = document.getElementById("filterType");
    if (!typeSelect) return; // Prevent crash if element is missing
  
    const uniqueTypes = [...new Set(rawTableData.map(item => item.type.trim()).filter(a => a !== ""))].sort();
    typeSelect.innerHTML = `<option value="ALL">All Types</option>`;
    uniqueTypes.forEach(act => {
      const opt = document.createElement("option");
      opt.value = act;
      opt.textContent = act;
      typeSelect.appendChild(opt);
    });
  }

  // handle sidebar clicks:
  function filterByCategory(category, element, event) {
    if (event) event.preventDefault();
    currentCategory = category;

    const url = new URL(window.location.href);
    if (category === "ALL") {
      url.searchParams.delete("nav");
    } else {
      url.searchParams.set("nav", category);
    }
    window.history.replaceState(null, "", url);
  
    // Update active state class on sidebar links
    document.querySelectorAll(".sidebar-link").forEach(link => link.classList.remove("active"));
    if (element) element.classList.add("active");

    const isLegacy = category.toLowerCase() === "legacy";
    const isCamping = category.toLowerCase() === "camping";
    document.getElementById("checklistTable").hidden = isLegacy || isCamping;
    document.getElementById("legacyTable").hidden = !isLegacy;
    document.getElementById("campingTable").hidden = !isCamping;
    document.getElementById("contentFilters").style.display = isLegacy || isCamping ? "none" : "";
    document.getElementById("legacyFilters").style.display = isLegacy ? "" : "none";
    document.getElementById("campingFilters").style.display = isCamping ? "" : "none";
    document.querySelector(".content-body").classList.toggle("legacy-view", isLegacy);
  
    applyFilters();
  }

function applyFilters() {
  if (currentCategory.toLowerCase() === "legacy") {
    renderLegacyTable();
    return;
  }
  if (currentCategory.toLowerCase() === "camping") {
    renderCampingTable();
    return;
  }
  if (!mainDataAvailable) {
    document.getElementById("tableBody").innerHTML = `
      <tr>
        <td colspan="4" class="status-msg" style="color: #ff6b6b;">Error loading data...</td>
      </tr>`;
    return;
  }

  const levelFilter = document.getElementById("filterLevel")?.value || "ALL";
  const typeFilter = document.getElementById("filterType")?.value || "ALL";
  const searchVal = document.getElementById("filterSearch")?.value.trim() || "";

  filteredData = rawTableData.filter(item => {
    if (item.type.toLowerCase().includes("legacy")) return false;

    let matchesLevel = true;
    let matchesType = true;
    let matchesCategory = true;
    let matchesSearch = true;

    if (levelFilter !== "ALL") {
      matchesLevel = checkLevelMatch(item.level, levelFilter);
    }

    if (typeFilter !== "ALL") {
      matchesType = item.type.trim() === typeFilter;
    }

    // Category matching logic against Type or Zone text
    if (currentCategory !== "ALL") {
      const act = item.type.toLowerCase();
      const cat = currentCategory.toLowerCase();
      
      if (cat === "zones") {
        matchesCategory = !act.includes("dungeon") && !act.includes("raid");
      } else if (cat === "dungeons") {
        matchesCategory = act.includes("dungeon");
      } else if (cat === "raids") {
        matchesCategory = act.includes("raid");
      }
    }

    if (searchVal !== "") {
      matchesSearch = checkSearchMatch(item, searchVal);
    }

    return matchesLevel && matchesType && matchesCategory && matchesSearch;
  });

  if (currentSortColumn !== -1) {
    sortDataArray(filteredData, currentSortColumn, currentSortAsc);
  }

  renderTable();
}

  function renderLegacyTable() {
    const table = document.getElementById("legacyTable");
    const searchValue = document.getElementById("filterSearch").value.trim().toLowerCase();
    const legacyTypeFilter = document.getElementById("filterLegacyType")?.value.trim().toLowerCase() || "all";
    const visibleColumns = legacyColumns
      .map((column, valueIndex) => ({ ...column, valueIndex }))
      .filter(column => column.name.trim().toLowerCase() !== "reward");
    const descriptionIndex = legacyColumns.findIndex(column => column.name.trim().toLowerCase() === "description");
    table.replaceChildren();
    const header = table.createTHead();
    const headerRow = header.insertRow();
    const checkboxHeader = document.createElement("th");
    checkboxHeader.className = "no-sort";
    headerRow.appendChild(checkboxHeader);

    visibleColumns.forEach(column => {
      const cell = document.createElement("th");
      cell.textContent = column.name;
      if (column.name.trim().toLowerCase() === "description") {
        cell.classList.add("legacy-description");
      } else if (column.name.trim().toLowerCase() === "challenge") {
        cell.classList.add("legacy-challenge");
      } else if (column.name.trim().toLowerCase() === "type") {
        cell.classList.add("legacy-type");
      }
      headerRow.appendChild(cell);
    });

    const tbody = table.createTBody();
    const visibleRows = legacyRows.filter(row => {
      const rowText = row.values.join(" ").toLowerCase();
      const matchesSearch = !searchValue || rowText.includes(searchValue);
      if (!matchesSearch) return false;

      if (legacyTypeFilter !== "all") {
        // Find the "Type" column dynamically if present
        const typeColIndex = legacyColumns.findIndex(c => c.name.toLowerCase() === "type");
        if (typeColIndex !== -1) {
          const rowType = (row.values[typeColIndex] || "").trim().toLowerCase();
          if (rowType !== legacyTypeFilter) return false;
        }
      }
      return true;
    });

    if (visibleRows.length === 0) {
      const row = tbody.insertRow();
      const cell = row.insertCell();
      cell.colSpan = visibleColumns.length + 1;
      cell.className = "status-msg";
      cell.textContent = legacyRows.length === 0
        ? "No Legacy achievements are available."
        : "No achievements match the search.";
      return;
    }

    visibleRows.forEach(legacyRow => {
      const row = tbody.insertRow();
      const checkboxCell = row.insertCell();
      checkboxCell.className = "col-cb";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = localStorage.getItem(`wow_legacy_${legacyRow.id}`) === "true";
      if (checkbox.checked) row.classList.add("completed");
      checkbox.addEventListener("change", () => {
        localStorage.setItem(`wow_legacy_${legacyRow.id}`, checkbox.checked);
        row.classList.toggle("completed", checkbox.checked);
      });
      checkboxCell.appendChild(checkbox);

      visibleColumns.forEach(column => {
        const cell = row.insertCell();
        const value = legacyRow.values[column.valueIndex];
        cell.textContent = value;
        if (column.name.trim().toLowerCase() === "description") {
          cell.classList.add("legacy-description");
        } else if (column.name.trim().toLowerCase() === "challenge") {
          cell.classList.add("legacy-challenge");
          const description = legacyRow.values[descriptionIndex] || "";
          if (description) {
            cell.classList.add("has-note");
            cell.setAttribute("data-description", description);
            const tooltip = document.createElement("span");
            tooltip.className = "legacy-tooltip";
            tooltip.textContent = description;
            cell.appendChild(tooltip);
          }
        } else if (column.name.trim().toLowerCase() === "type") {
          cell.classList.add("legacy-type");
        }
      });
    });
  }

  function renderCampingTable() {
    const tbody = document.getElementById("campingTableBody");
    const searchValue = document.getElementById("filterSearch").value.trim().toLowerCase();
    const typeFilter = document.getElementById("filterCampingType").value;
    const visibleRows = campingRows.filter(row =>
      (typeFilter === "ALL" || row.type === typeFilter) &&
      (!searchValue || [row.skill, row.type, row.item, row.description, row.tier, row.reagents]
        .some(value => value.toLowerCase().includes(searchValue)))
    );
    if (campingSortColumn !== -1) {
      const columnKeys = ["skill", "type", "item"];
      const key = columnKeys[campingSortColumn];
      visibleRows.sort((a, b) => campingSortAsc
        ? a[key].localeCompare(b[key], undefined, { numeric: true, sensitivity: "base" })
        : b[key].localeCompare(a[key], undefined, { numeric: true, sensitivity: "base" }));
    }
    tbody.replaceChildren();

    if (visibleRows.length === 0) {
      const row = tbody.insertRow();
      const cell = row.insertCell();
      cell.colSpan = 4;
      cell.className = "status-msg";
      cell.textContent = campingRows.length === 0
        ? "No Camping data is available."
        : "No items match the search.";
      return;
    }

    visibleRows.forEach(item => {
      const row = tbody.insertRow();
      const checkboxCell = row.insertCell();
      checkboxCell.className = "col-cb";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = localStorage.getItem(`wow_chk_camping_${item.id}`) === "true";
      if (checkbox.checked) row.classList.add("completed");
      checkbox.addEventListener("change", () => toggleCheck(`camping_${item.id}`, checkbox));
      checkboxCell.appendChild(checkbox);
      row.insertCell().textContent = item.skill;
      row.insertCell().textContent = item.type;
      const itemCell = row.insertCell();
      const link = document.createElement("a");
      link.href = "#";
      link.className = "dungeon-link";
      link.textContent = item.item;
      link.addEventListener("click", event => openDetails(item.id, "camping", event));
      itemCell.appendChild(link);
    });
  }

  function populateCampingTypeFilterOptions() {
    const typeSelect = document.getElementById("filterCampingType");
    const selectedType = typeSelect.value;
    const uniqueTypes = [...new Set(campingRows.map(row => row.type.trim()).filter(Boolean))].sort();
    typeSelect.innerHTML = '<option value="ALL">All Types</option>';
    uniqueTypes.forEach(type => {
      const option = document.createElement("option");
      option.value = type;
      option.textContent = type;
      typeSelect.appendChild(option);
    });
    if (uniqueTypes.includes(selectedType)) typeSelect.value = selectedType;
  }

  function sortCampingTable(columnIndex) {
    if (campingSortColumn === columnIndex) {
      campingSortAsc = !campingSortAsc;
    } else {
      campingSortColumn = columnIndex;
      campingSortAsc = true;
    }

    document.querySelectorAll("#campingTable th").forEach((header, index) => {
      header.classList.remove("sort-asc", "sort-desc");
      header.setAttribute("aria-sort", "none");
      if (index === campingSortColumn + 1) {
        header.classList.add(campingSortAsc ? "sort-asc" : "sort-desc");
        header.setAttribute("aria-sort", campingSortAsc ? "ascending" : "descending");
      }
    });
    renderCampingTable();
  }

  function checkLevelMatch(itemLevelStr, targetRange) {
    const cleanLevel = itemLevelStr.replace('?', '').trim();
    if (!cleanLevel) return false;

    if (targetRange === "60") {
      return cleanLevel === "60";
    }

    const [rangeMin, rangeMax] = targetRange.split('-').map(Number);

    if (cleanLevel.includes('-')) {
      const [itemMin, itemMax] = cleanLevel.split('-').map(Number);
      return (itemMin <= rangeMax && itemMax >= rangeMin);
    }

    const singleVal = Number(cleanLevel);
    if (!isNaN(singleVal)) {
      return singleVal >= rangeMin && singleVal <= rangeMax;
    }

    return false;
  }

  function checkSearchMatch(item, query) {
    // If numeric, search level column range/value
    if (/^\d+$/.test(query)) {
      const numQuery = Number(query);
      return checkSingleLevelValueMatch(item.level, numQuery);
    }
  
    // Otherwise, search across all columns
    const lowerQuery = query.toLowerCase();
    return (
      item.level.toLowerCase().includes(lowerQuery) ||
      item.zone.toLowerCase().includes(lowerQuery) ||
      item.type.toLowerCase().includes(lowerQuery)
    );
  }

  function checkSingleLevelValueMatch(itemLevelStr, queryNum) {
    const cleanLevel = itemLevelStr.replace('?', '').trim();
    if (!cleanLevel) return false;
  
    if (cleanLevel.includes('-')) {
      const [itemMin, itemMax] = cleanLevel.split('-').map(Number);
      return queryNum >= itemMin && queryNum <= itemMax;
    }
  
    const singleVal = Number(cleanLevel);
    if (!isNaN(singleVal)) {
      return singleVal === queryNum;
    }
  
    return false;
  }

  function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
  
    if (filteredData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="status-msg">No items match the selected filters.</td>
        </tr>`;
      return;
    }
  
    filteredData.forEach(item => {
      const isChecked = localStorage.getItem(`wow_chk_${item.id}`) === "true";
      const tr = document.createElement("tr");
      if (isChecked) tr.classList.add("completed");

      const rawType = item.type.toLowerCase();
      let tagClass = "zone";
      let itemCategory = "zone";

      if (rawType.includes("dungeon")) {
        tagClass = "dungeon";
        itemCategory = "dungeon";
      } else if (rawType.includes("raid")) {
        tagClass = "raid";
        itemCategory = "raid";
      }

      const notes = item.cellNotes || {};
      const key = item.zone.toLowerCase().trim();
      const entityId = key.replace(/[^a-z0-9]/g, "-");

      const dungeonInfo = itemCategory === "dungeon" ? dungeonMap.get(key) : null;
      const raidInfo = itemCategory === "raid" ? raidMap.get(key) : null;
      const zoneInfo = itemCategory === "zone" ? zoneMap.get(key) : null;
      const detailData = dungeonInfo || raidInfo || zoneInfo;

      const detailLocation = detailData?.location || "";
      const zoneNoteText = detailLocation || notes.zone || "";

      const levelTooltip = notes.level ? `data-tooltip="${escapeHtml(notes.level)}"` : "";
      const zoneTooltip = zoneNoteText ? `data-tooltip="${escapeHtml(zoneNoteText)}"` : "";

      const levelClass = notes.level ? 'class="col-level has-note"' : 'class="col-level"';
      const zoneClass = zoneNoteText ? 'class="col-zone has-note"' : 'class="col-zone"';

      const encodedZoneName = encodeURIComponent(item.zone).replace(/'/g, "%27");
      const zoneContent = `<a href="#" class="dungeon-link" onclick="openDetails('${encodedZoneName}', '${itemCategory}', event)">${escapeHtml(item.zone)}</a>`;
      const typePill = `<span class="type-tag ${tagClass}">${escapeHtml(item.type)}</span>`;

      // Calculate Quests/Bosses Progress
      const progressHtml = getItemProgress(detailData, entityId);

      tr.innerHTML = `
        <td class="col-cb">
          <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleCheck('${item.id}', this)">
        </td>
        <td ${levelClass} ${levelTooltip}>${escapeHtml(item.level)}</td>
        <td ${zoneClass} ${zoneTooltip}>${zoneContent}<br>${typePill}</td>
        <td class="col-progress">${progressHtml}</td>
      `;
      
      tbody.appendChild(tr);
    });

    // Apply visibility state of the progress column based on the checkbox toggle
    toggleProgressColumn();
  }
  
  function openDetails(encodedZoneName, category, event) {
    if (event) event.preventDefault();
    if (category === "camping") {
      const item = campingRows.find(row => row.id === encodedZoneName);
      const panel = document.getElementById("detailsPanel");
      if (!item) return;
      const reagentList = item.reagents.split(/\r?\n/)
        .map(reagent => reagent.trim())
        .filter(Boolean)
        .map(reagent => `<li><a class="wowhead-reagent-link" href="#" aria-disabled="true" title="Resolving item on Wowhead" data-item-name="${escapeHtml(reagent)}" target="_blank" rel="noopener noreferrer"><img src="images/wowhead.webp" alt="View on Wowhead"></a><span>${escapeHtml(reagent)}</span></li>`)
        .join("");

      panel.innerHTML = `
        <div class="panel-header">
          <h3>${escapeHtml(item.item)}</h3>
          <button onclick="closePanel()">&times;</button>
        </div>
        <div class="panel-body">
          <p><strong>Tier:</strong> ${escapeHtml(item.tier)}</p>
          <p><strong>Description:</strong></p>
          <p>${escapeHtml(item.description)}</p>
          <hr>
          <p><strong>Reagents:</strong></p>
          <ul class="camping-reagents">${reagentList}</ul>
        </div>`;
      panel.querySelectorAll(".wowhead-reagent-link").forEach(link => {
        link.addEventListener("click", event => {
          if (link.getAttribute("aria-disabled") === "true") event.preventDefault();
        });
        getWowheadItemUrl(link.dataset.itemName).then(url => {
          if (!link.isConnected) return;
          if (url) {
            link.href = url;
            link.title = "View item on Wowhead";
            link.removeAttribute("aria-disabled");
          } else {
            link.href = `https://www.wowhead.com/search?q=${encodeURIComponent(link.dataset.itemName)}#items`;
            link.title = "Could not resolve item on Wowhead";
            link.removeAttribute("aria-disabled");
          }
        });
      });
      showDetailsPanel(panel);
      return;
    }

    const zoneName = decodeURIComponent(encodedZoneName);
    const panel = document.getElementById("detailsPanel");
    let backdrop = document.getElementById("modalBackdrop");
  
    const key = zoneName.toLowerCase().trim();
    let data = null;

    if (category === "dungeon") {
      data = dungeonMap.get(key);
    } else if (category === "raid") {
      data = raidMap.get(key);
    } else if (category === "zone") {
      data = zoneMap.get(key);
    }

    if (!data) {
      panel.innerHTML = `
        <div class="panel-header">
          <h3>${escapeHtml(zoneName)}</h3>
          <button onclick="closePanel()">&times;</button>
        </div>
        <div class="panel-body">
          <p style="color: var(--text-dim);">No detailed entry found in the ${escapeHtml(category)} tab.</p>
        </div>`;
    } else {
      const entityId = key.replace(/[^a-z0-9]/g, "-");
      const formattedQuests = renderListWithCheckboxes(data.quests, entityId, "quest");
      const formattedBosses = renderListWithCheckboxes(data.bosses, entityId, "boss");

      const imageHtml = data.image 
        ? `<img src="images/${escapeHtml(data.image)}.webp" alt="${escapeHtml(data.name)}" class="panel-thumb">`
        : '';

      panel.innerHTML = `
        <div class="panel-header">
          <h3>${escapeHtml(data.name)}</h3>
          <button onclick="closePanel()">&times;</button>
        </div>
        <div class="panel-body">
          ${imageHtml}
          <hr>
          <p><strong>Level:</strong> ${escapeHtml(data.level)}</p>
          <p><strong>Location:</strong> ${escapeHtml(data.location)}</p>
          <hr>
          <p><strong>Quests:</strong></p>
          <div class="detail-checklist">${formattedQuests}</div>
          <p><strong>Bosses:</strong></p>
          <div class="detail-checklist">${formattedBosses}</div>
        </div>`;
    }
    
    showDetailsPanel(panel);
  }

  function showDetailsPanel(panel) {
    let backdrop = document.getElementById("modalBackdrop");
    panel.classList.add("active");

    if (window.innerWidth <= 960) {
      if (!backdrop) {
        backdrop = document.createElement("div");
        backdrop.id = "modalBackdrop";
        backdrop.className = "modal-backdrop";
        backdrop.onclick = closePanel;
        document.body.appendChild(backdrop);
      }
      backdrop.classList.add("active");
      document.body.classList.add("modal-open");
    }
  }

  function renderListWithCheckboxes(rawText, entityId, prefix) {
    if (isTbd(rawText)) return escapeHtml(rawText.trim());
    if (!rawText || !rawText.trim()) return '<span style="color: var(--text-dim);">None</span>';
    
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== "");
    return lines.map(line => {
      // Create a persistent slug from the item text (e.g., "Collect 5 Bandages" -> "collect-5-bandages")
      const itemSlug = line.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-");
      const key = `wow_detail_${entityId}_${prefix}_${itemSlug}`;
      
      const isChecked = localStorage.getItem(key) === "true";
      const completedClass = isChecked ? "completed" : "";
      return `
        <div class="detail-item ${completedClass}">
          <label>
            <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleDetailCheck('${key}', this)">
            <span>${escapeHtml(line)}</span>
          </label>
        </div>`;
    }).join("");
  }

  function isTbd(rawText) {
    return typeof rawText === "string" && rawText.trim().toLowerCase() === "tbd";
  }

  function toggleDetailCheck(key, checkbox) {
    localStorage.setItem(key, checkbox.checked);
    const parent = checkbox.closest(".detail-item");
    if (checkbox.checked) {
      parent.classList.add("completed");
    } else {
      parent.classList.remove("completed");
    }

    // Refresh table so row progress counts update immediately
    renderTable();
  }
  
  function closePanel() {
    document.getElementById("detailsPanel")?.classList.remove("active");
    document.getElementById("modalBackdrop")?.classList.remove("active");
    document.body.classList.remove("modal-open");
  }

  function toggleCheck(id, checkbox) {
    localStorage.setItem(`wow_chk_${id}`, checkbox.checked);
    const tr = checkbox.closest("tr");
    if (checkbox.checked) {
      tr.classList.add("completed");
    } else {
      tr.classList.remove("completed");
    }
  }

  function sortTable(columnIndex) {
    const table = document.getElementById("checklistTable");
    const headers = table.querySelectorAll("th");
    
    if (currentSortColumn === columnIndex) {
      currentSortAsc = !currentSortAsc;
    } else {
      currentSortColumn = columnIndex;
      currentSortAsc = true;
    }

    headers.forEach((h, idx) => {
      h.classList.remove("sort-asc", "sort-desc");
      if (idx === columnIndex) {
        h.classList.add(currentSortAsc ? "sort-asc" : "sort-desc");
      }
    });

    sortDataArray(filteredData, columnIndex, currentSortAsc);
    renderTable();
  }

  function sortDataArray(dataArray, columnIndex, asc) {
    dataArray.sort((a, b) => {
      let valA = getColumnValue(a, columnIndex).trim();
      let valB = getColumnValue(b, columnIndex).trim();

      // If sorting by Level (columnIndex 1), force '?' to the bottom
      if (columnIndex === 1) {
        if (valA === '?' && valB !== '?') return 1;
        if (valA !== '?' && valB === '?') return -1;
        if (valA === '?' && valB === '?') return 0;
      }

      return asc 
        ? valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' })
        : valB.localeCompare(valA, undefined, { numeric: true, sensitivity: 'base' });
    });
  }

  function getColumnValue(item, index) {
    switch(index) {
      case 1: return item.level;
      case 2: return item.zone;
      default: return "";
    }
  }

  function getItemProgress(data, entityId) {
    const questStats = countCategoryProgress(data?.quests, entityId, "quest");
    const bossStats = countCategoryProgress(data?.bosses, entityId, "boss");

    let html = "";
    if (isTbd(data?.quests)) {
      html += `Quests: ${escapeHtml(data.quests.trim())}<br>`;
    } else if (questStats.total > 0) {
      const qDone = questStats.checked === questStats.total;
      html += `Quests (${questStats.checked}/${questStats.total})${qDone ? ' ✅' : ''}<br>`;
    }
    if (isTbd(data?.bosses)) {
      html += `Bosses: ${escapeHtml(data.bosses.trim())}`;
    } else if (bossStats.total > 0) {
      const bDone = bossStats.checked === bossStats.total;
      html += `Bosses (${bossStats.checked}/${bossStats.total})${bDone ? ' ✅' : ''}`;
    }

    return html || '<span style="color: var(--text-dim);">-</span>';
  }

  function countCategoryProgress(rawText, entityId, prefix) {
    if (!rawText || !rawText.trim() || isTbd(rawText)) return { checked: 0, total: 0 };
    
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== "");
    let checkedCount = 0;

    lines.forEach(line => {
      const itemSlug = line.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-");
      const key = `wow_detail_${entityId}_${prefix}_${itemSlug}`;
      if (localStorage.getItem(key) === "true") {
        checkedCount++;
      }
    });

    return { checked: checkedCount, total: lines.length };
  }

  function toggleProgressColumn() {
    const show = document.getElementById("toggleProgress").checked;
    document.querySelectorAll(".col-progress").forEach(el => {
      el.style.display = show ? "" : "none";
    });
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  document.addEventListener("DOMContentLoaded", loadSheetData);
</script>

</body>
</html>
