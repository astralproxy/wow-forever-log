<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  
  <div class="header-container">
    <img src="logo.png" alt="Logo" class="header-logo">
    <h2>Forever Log</h2>
    <span class="header-note">✅ items to mark them as explored.</span>
  </div>
  
  <div class="wiki-layout">      
    <!-- LEFT SIDEBAR MENU -->
    <aside class="wiki-sidebar">
      <div class="sidebar-title">Navigation</div>
      <ul class="sidebar-menu">
        <li><a href="#" class="sidebar-link active" onclick="filterByCategory('ALL', this)">All Content</a></li>
        <li><a href="#" class="sidebar-link" onclick="filterByCategory('Dungeons', this)">Dungeons</a></li>
        <li><a href="#" class="sidebar-link" onclick="filterByCategory('Raids', this)">Raids</a></li>
        <li><a href="#" class="sidebar-link" onclick="filterByCategory('Zones', this)">Zones</a></li>
      </ul>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="wiki-content">

      <!-- FILTERS at top of page -->
      <div class="filter-bar">
        <div class="filter-group">
          <label for="toggleProgress">
            <input type="checkbox" id="toggleProgress" checked onchange="toggleProgressColumn()"> Show Progress
          </label>
          <label for="filterLevel">Level:</label>
          <select id="filterLevel" onchange="applyFilters()">
            <option value="ALL">All Levels</option>
            <option value="1-10">1-10</option>
            <option value="11-20">11-20</option>
            <option value="21-30">21-30</option>
            <option value="31-40">31-40</option>
            <option value="41-50">41-50</option>
            <option value="51-60">51-60</option>
            <option value="60">60 Only</option>
          </select>
  
          <label for="filterType">Type:</label>
          <select id="filterType" onchange="applyFilters()">
            <option value="ALL">All Types</option>
          </select>
        </div>

        <div class="filter-group filter-search">
          <label for="filterSearch">Search:</label>
          <input type="text" id="filterSearch" placeholder="Search..." oninput="applyFilters()">
        </div>
      </div>

    <!-- WRAPPER FOR TABLE + SIDE PANEL -->
    <div class="content-body">
      <div class="table-container">
        <table id="checklistTable">
          <thead>
            <tr>
              <th class="col-cb no-sort"></th>
              <th class="col-progress">Progress</th>
              <th class="col-level" onclick="sortTable(1)">Level</th>
              <th class="col-zone" onclick="sortTable(2)">Zone/Location</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="4" class="status-msg">Loading Data...</td>
            </tr>
          </tbody>
        </table>
      </div>

    <!-- Side Details Panel -->
    <aside id="detailsPanel" class="details-panel">
      <div class="panel-placeholder">Select a dungeon to view details.</div>
    </aside>
  </div>
</main>

<script>
  const LOADING_MESSAGES = [
    "Polishing corrupted Ashbringers",
    "Reading Barrens chat logs",
    "Teaching Murlocs proper syntax",
    "Inoculating battle pets",
    "Re-anchoring Dalaran",
    "Calculating Hogger's aggro radius",
    "Calibrating Gnomish algorithms",
    "Feeding stray Mana Wyrms",
    "Running back to corpse",
    "Polishing Onyxia's head",
    "Sorting soul shards by color",
    "Tuning the Deeprun Tram engines",
    "Herding Westfall chickens",
    "Assembling additional peons",
    "Sweeping the steps of Icecrown Citadel"
  ];
  
  const SPREADSHEET_ID = "1PWAetMYOglFXz7ISOKisYgRGpZ4Pnfa1D4WL1Hv7D94";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;
  const API_URL = "https://script.google.com/macros/s/AKfycbzlfcXQC8kkSWoIeDBj2IWslxsfrOTEHL00Sx2pu6795eOk05aI0NUd1pjZVfvWZjG8/exec"; // for notes, etc
  
  // Add URL for the detailed tabs/sheets using its gviz CSV endpoint or gid parameter
  const DUNGEON_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Dungeons`;
  const RAID_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Raids`;
  const ZONE_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Zones`;

  let dungeonMap = new Map(); // Store dungeon lookup data keyed by name
  let raidMap = new Map(); // Store raid lookup data keyed by name
  let zoneMap = new Map(); // Store zone lookup data keyed by name

  let rawTableData = [];
  let filteredData = [];
  let currentSortColumn = -1;
  let currentSortAsc = true;
  let currentCategory = "ALL";

  async function loadSheetData() {
    const randomMsg = LOADING_MESSAGES[Math.floor(Math.random() * LOADING_MESSAGES.length)];
    const tbody = document.getElementById("tableBody");
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="status-msg">${escapeHtml(randomMsg)}...</td>
        </tr>`;
    }
    
    try {
      // 1. Fetch main data, Dungeon, Raid, and Zone CSV tabs concurrently
      const [mainRes, dungeonRes, raidRes, zoneRes] = await Promise.all([
        fetch(API_URL),
        fetch(DUNGEON_CSV_URL),
        fetch(RAID_CSV_URL),
        fetch(ZONE_CSV_URL)
      ]);
  
      if (!mainRes.ok) throw new Error("Failed to fetch data");
      
      const data = await mainRes.json();
  
      // Parse Dungeon CSV tab
      if (dungeonRes.ok) {
        const csvText = await dungeonRes.text();
        const parsedRows = parseCSV(csvText);
        parsedRows.slice(1).forEach(row => {
          if (row.length > 1) {
            const name = row[1].trim().toLowerCase();
            dungeonMap.set(name, {
              level: row[0] || "",
              name: row[1] || "",
              location: row[2] || "",
              quests: row[3] || "",
              bosses: row[4] || "",
              image: row[6] ? row[6].trim() : ""
            });
          }
        });
      }

      // Parse Raid CSV tab
      if (raidRes.ok) {
        const csvText = await raidRes.text();
        const parsedRows = parseCSV(csvText);
        parsedRows.slice(1).forEach(row => {
          if (row.length > 1) {
            const name = row[1].trim().toLowerCase();
            raidMap.set(name, {
              level: row[0] || "",
              name: row[1] || "",
              location: row[2] || "",
              quests: row[3] || "",
              bosses: row[4] || "",
              image: row[6] ? row[6].trim() : ""
            });
          }
        });
      }

      // Parse Zone CSV tab
      if (zoneRes.ok) {
        const csvText = await zoneRes.text();
        const parsedRows = parseCSV(csvText);
        parsedRows.slice(1).forEach(row => {
          if (row.length > 1) {
            const name = row[1].trim().toLowerCase();
            zoneMap.set(name, {
              level: row[0] || "",
              name: row[1] || "",
              location: row[2] || "",
              quests: row[3] || "",
              bosses: row[4] || "",
              image: row[6] ? row[6].trim() : ""
            });
          }
        });
      }
  
      rawTableData = data.map(item => ({
        id: (item.zone || "").toLowerCase().replace(/[^a-z0-9]/g, "-"),
        level: item.level || "",
        zone: item.zone || "",
        type: item.type || item.activity || "",
        cellNotes: item.cellNotes || { level: "", zone: "", type: "" }
      })).filter(item => item.zone.trim() !== "");

      populateTypeFilterOptions();
  
      currentSortColumn = 1;
      currentSortAsc = true;
      applyFilters();
    } catch (err) {
      console.error(err);
      document.getElementById("tableBody").innerHTML = `
        <tr>
          <td colspan="4" class="status-msg" style="color: #ff6b6b;">
            Error loading data...
          </td>
        </tr>`;
    }
  }

  function parseCSV(text) {
    const lines = [];
    let row = [];
    let inQuotes = false;
    let currentCell = '';

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (inQuotes && nextChar === '"') {
          currentCell += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        row.push(currentCell.trim());
        currentCell = '';
      } else if ((char === '\r' || char === '\n') && !inQuotes) {
        if (char === '\r' && nextChar === '\n') i++;
        row.push(currentCell.trim());
        if (row.some(cell => cell !== '')) lines.push(row);
        row = [];
        currentCell = '';
      } else {
        currentCell += char;
      }
    }
    if (currentCell || row.length > 0) {
      row.push(currentCell.trim());
      if (row.some(cell => cell !== '')) lines.push(row);
    }
    return lines;
  }

  function populateTypeFilterOptions() {
    const typeSelect = document.getElementById("filterType");
    if (!typeSelect) return; // Prevent crash if element is missing
  
    const uniqueTypes = [...new Set(rawTableData.map(item => item.type.trim()).filter(a => a !== ""))].sort();
    typeSelect.innerHTML = `<option value="ALL">All Types</option>`;
    uniqueTypes.forEach(act => {
      const opt = document.createElement("option");
      opt.value = act;
      opt.textContent = act;
      typeSelect.appendChild(opt);
    });
  }

  // handle sidebar clicks:
  function filterByCategory(category, element, event) {
    if (event) event.preventDefault();
    currentCategory = category;
  
    // Update active state class on sidebar links
    document.querySelectorAll(".sidebar-link").forEach(link => link.classList.remove("active"));
    if (element) element.classList.add("active");
  
    applyFilters();
  }

function applyFilters() {
  const levelFilter = document.getElementById("filterLevel")?.value || "ALL";
  const typeFilter = document.getElementById("filterType")?.value || "ALL";
  const searchVal = document.getElementById("filterSearch")?.value.trim() || "";

  filteredData = rawTableData.filter(item => {
    let matchesLevel = true;
    let matchesType = true;
    let matchesCategory = true;
    let matchesSearch = true;

    if (levelFilter !== "ALL") {
      matchesLevel = checkLevelMatch(item.level, levelFilter);
    }

    if (typeFilter !== "ALL") {
      matchesType = item.type.trim() === typeFilter;
    }

    // Category matching logic against Type or Zone text
    if (currentCategory !== "ALL") {
      const act = item.type.toLowerCase();
      const cat = currentCategory.toLowerCase();
      
      if (cat === "zones") {
        matchesCategory = !act.includes("dungeon") && !act.includes("raid");
      } else if (cat === "dungeons") {
        matchesCategory = act.includes("dungeon");
      } else if (cat === "raids") {
        matchesCategory = act.includes("raid");
      }
    }

    if (searchVal !== "") {
      matchesSearch = checkSearchMatch(item, searchVal);
    }

    return matchesLevel && matchesType && matchesCategory && matchesSearch;
  });

  if (currentSortColumn !== -1) {
    sortDataArray(filteredData, currentSortColumn, currentSortAsc);
  }

  renderTable();
}

  function checkLevelMatch(itemLevelStr, targetRange) {
    const cleanLevel = itemLevelStr.replace('?', '').trim();
    if (!cleanLevel) return false;

    if (targetRange === "60") {
      return cleanLevel === "60";
    }

    const [rangeMin, rangeMax] = targetRange.split('-').map(Number);

    if (cleanLevel.includes('-')) {
      const [itemMin, itemMax] = cleanLevel.split('-').map(Number);
      return (itemMin <= rangeMax && itemMax >= rangeMin);
    }

    const singleVal = Number(cleanLevel);
    if (!isNaN(singleVal)) {
      return singleVal >= rangeMin && singleVal <= rangeMax;
    }

    return false;
  }

  function checkSearchMatch(item, query) {
    // If numeric, search level column range/value
    if (/^\d+$/.test(query)) {
      const numQuery = Number(query);
      return checkSingleLevelValueMatch(item.level, numQuery);
    }
  
    // Otherwise, search across all columns
    const lowerQuery = query.toLowerCase();
    return (
      item.level.toLowerCase().includes(lowerQuery) ||
      item.zone.toLowerCase().includes(lowerQuery) ||
      item.type.toLowerCase().includes(lowerQuery)
    );
  }

  function checkSingleLevelValueMatch(itemLevelStr, queryNum) {
    const cleanLevel = itemLevelStr.replace('?', '').trim();
    if (!cleanLevel) return false;
  
    if (cleanLevel.includes('-')) {
      const [itemMin, itemMax] = cleanLevel.split('-').map(Number);
      return queryNum >= itemMin && queryNum <= itemMax;
    }
  
    const singleVal = Number(cleanLevel);
    if (!isNaN(singleVal)) {
      return singleVal === queryNum;
    }
  
    return false;
  }

  function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
  
    if (filteredData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="status-msg">No items match the selected filters.</td>
        </tr>`;
      return;
    }
  
    filteredData.forEach(item => {
      const isChecked = localStorage.getItem(`wow_chk_${item.id}`) === "true";
      const tr = document.createElement("tr");
      if (isChecked) tr.classList.add("completed");

      const rawType = item.type.toLowerCase();
      let tagClass = "zone";
      let itemCategory = "zone";

      if (rawType.includes("dungeon")) {
        tagClass = "dungeon";
        itemCategory = "dungeon";
      } else if (rawType.includes("raid")) {
        tagClass = "raid";
        itemCategory = "raid";
      }

      const notes = item.cellNotes || {};
      const key = item.zone.toLowerCase().trim();
      const entityId = key.replace(/[^a-z0-9]/g, "-");

      const dungeonInfo = itemCategory === "dungeon" ? dungeonMap.get(key) : null;
      const raidInfo = itemCategory === "raid" ? raidMap.get(key) : null;
      const zoneInfo = itemCategory === "zone" ? zoneMap.get(key) : null;
      const detailData = dungeonInfo || raidInfo || zoneInfo;

      const detailLocation = detailData?.location || "";
      const zoneNoteText = detailLocation || notes.zone || "";

      const levelTooltip = notes.level ? `data-tooltip="${escapeHtml(notes.level)}"` : "";
      const zoneTooltip = zoneNoteText ? `data-tooltip="${escapeHtml(zoneNoteText)}"` : "";

      const levelClass = notes.level ? 'class="col-level has-note"' : 'class="col-level"';
      const zoneClass = zoneNoteText ? 'class="col-zone has-note"' : 'class="col-zone"';

      const encodedZoneName = encodeURIComponent(item.zone).replace(/'/g, "%27");
      const zoneContent = `<a href="#" class="dungeon-link" onclick="openDetails('${encodedZoneName}', '${itemCategory}', event)">${escapeHtml(item.zone)}</a>`;
      const typePill = `<span class="type-tag ${tagClass}">${escapeHtml(item.type)}</span>`;

      // Calculate Quests/Bosses Progress
      const progressHtml = getItemProgress(detailData, entityId);

      tr.innerHTML = `
        <td class="col-cb">
          <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleCheck('${item.id}', this)">
        </td>
        <td ${levelClass} ${levelTooltip}>${escapeHtml(item.level)}</td>
        <td ${zoneClass} ${zoneTooltip}>${zoneContent}<br>${typePill}</td>
        <td class="col-progress">${progressHtml}</td>
      `;
      
      tbody.appendChild(tr);
    });

    // Apply visibility state of the progress column based on the checkbox toggle
    toggleProgressColumn();
  }
  
  function openDetails(encodedZoneName, category, event) {
    if (event) event.preventDefault();
    const zoneName = decodeURIComponent(encodedZoneName);
    const panel = document.getElementById("detailsPanel");
    let backdrop = document.getElementById("modalBackdrop");
  
    const key = zoneName.toLowerCase().trim();
    let data = null;

    if (category === "dungeon") {
      data = dungeonMap.get(key);
    } else if (category === "raid") {
      data = raidMap.get(key);
    } else if (category === "zone") {
      data = zoneMap.get(key);
    }

    if (!data) {
      panel.innerHTML = `
        <div class="panel-header">
          <h3>${escapeHtml(zoneName)}</h3>
          <button onclick="closePanel()">&times;</button>
        </div>
        <div class="panel-body">
          <p style="color: var(--text-dim);">No detailed entry found in the ${escapeHtml(category)} tab.</p>
        </div>`;
    } else {
      const entityId = key.replace(/[^a-z0-9]/g, "-");
      const formattedQuests = renderListWithCheckboxes(data.quests, entityId, "quest");
      const formattedBosses = renderListWithCheckboxes(data.bosses, entityId, "boss");

      const imageHtml = data.image 
        ? `<img src="images/${escapeHtml(data.image)}.webp" alt="${escapeHtml(data.name)}" class="panel-thumb">`
        : '';

      panel.innerHTML = `
        <div class="panel-header">
          <h3>${escapeHtml(data.name)}</h3>
          <button onclick="closePanel()">&times;</button>
        </div>
        <div class="panel-body">
          ${imageHtml}
          <p><strong>Level:</strong> ${escapeHtml(data.level)}</p>
          <p><strong>Location:</strong> ${escapeHtml(data.location)}</p>
          <p><strong>Quests:</strong></p>
          <div class="detail-checklist">${formattedQuests}</div>
          <p><strong>Bosses:</strong></p>
          <div class="detail-checklist">${formattedBosses}</div>
        </div>`;
    }
    
    panel.classList.add("active");
  
    if (window.innerWidth <= 768) {
      if (!backdrop) {
        backdrop = document.createElement("div");
        backdrop.id = "modalBackdrop";
        backdrop.className = "modal-backdrop";
        backdrop.onclick = closePanel;
        document.body.appendChild(backdrop);
      }
      backdrop.classList.add("active");
    }
  }

  function renderListWithCheckboxes(rawText, entityId, prefix) {
    if (!rawText || !rawText.trim()) return '<span style="color: var(--text-dim);">None</span>';
    
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== "");
    return lines.map(line => {
      // Create a persistent slug from the item text (e.g., "Collect 5 Bandages" -> "collect-5-bandages")
      const itemSlug = line.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-");
      const key = `wow_detail_${entityId}_${prefix}_${itemSlug}`;
      
      const isChecked = localStorage.getItem(key) === "true";
      const completedClass = isChecked ? "completed" : "";
      return `
        <div class="detail-item ${completedClass}">
          <label>
            <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleDetailCheck('${key}', this)">
            <span>${escapeHtml(line)}</span>
          </label>
        </div>`;
    }).join("");
  }

  function toggleDetailCheck(key, checkbox) {
    localStorage.setItem(key, checkbox.checked);
    const parent = checkbox.closest(".detail-item");
    if (checkbox.checked) {
      parent.classList.add("completed");
    } else {
      parent.classList.remove("completed");
    }

    // Refresh table so row progress counts update immediately
    renderTable();
  }
  
  function closePanel() {
    document.getElementById("detailsPanel")?.classList.remove("active");
    document.getElementById("modalBackdrop")?.classList.remove("active");
  }

  function toggleCheck(id, checkbox) {
    localStorage.setItem(`wow_chk_${id}`, checkbox.checked);
    const tr = checkbox.closest("tr");
    if (checkbox.checked) {
      tr.classList.add("completed");
    } else {
      tr.classList.remove("completed");
    }
  }

  function sortTable(columnIndex) {
    const table = document.getElementById("checklistTable");
    const headers = table.querySelectorAll("th");
    
    if (currentSortColumn === columnIndex) {
      currentSortAsc = !currentSortAsc;
    } else {
      currentSortColumn = columnIndex;
      currentSortAsc = true;
    }

    headers.forEach((h, idx) => {
      h.classList.remove("sort-asc", "sort-desc");
      if (idx === columnIndex) {
        h.classList.add(currentSortAsc ? "sort-asc" : "sort-desc");
      }
    });

    sortDataArray(filteredData, columnIndex, currentSortAsc);
    renderTable();
  }

  function sortDataArray(dataArray, columnIndex, asc) {
    dataArray.sort((a, b) => {
      let valA = getColumnValue(a, columnIndex).trim();
      let valB = getColumnValue(b, columnIndex).trim();

      // If sorting by Level (columnIndex 1), force '?' to the bottom
      if (columnIndex === 1) {
        if (valA === '?' && valB !== '?') return 1;
        if (valA !== '?' && valB === '?') return -1;
        if (valA === '?' && valB === '?') return 0;
      }

      return asc 
        ? valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' })
        : valB.localeCompare(valA, undefined, { numeric: true, sensitivity: 'base' });
    });
  }

  function getColumnValue(item, index) {
    switch(index) {
      case 1: return item.level;
      case 2: return item.zone;
      default: return "";
    }
  }

  function getItemProgress(data, entityId) {
    const questStats = countCategoryProgress(data?.quests, entityId, "quest");
    const bossStats = countCategoryProgress(data?.bosses, entityId, "boss");

    let html = "";
    if (questStats.total > 0) {
      html += `Quests (${questStats.checked}/${questStats.total})<br>`;
    }
    if (bossStats.total > 0) {
      html += `Bosses (${bossStats.checked}/${bossStats.total})`;
    }

    return html || '<span style="color: var(--text-dim);">-</span>';
  }

  function countCategoryProgress(rawText, entityId, prefix) {
    if (!rawText || !rawText.trim()) return { checked: 0, total: 0 };
    
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== "");
    let checkedCount = 0;

    lines.forEach(line => {
      const itemSlug = line.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-");
      const key = `wow_detail_${entityId}_${prefix}_${itemSlug}`;
      if (localStorage.getItem(key) === "true") {
        checkedCount++;
      }
    });

    return { checked: checkedCount, total: lines.length };
  }

  function toggleProgressColumn() {
    const show = document.getElementById("toggleProgress").checked;
    document.querySelectorAll(".col-progress").forEach(el => {
      el.style.display = show ? "" : "none";
    });
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  document.addEventListener("DOMContentLoaded", loadSheetData);
</script>

</body>
</html>
